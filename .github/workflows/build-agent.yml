# 用 PyInstaller 构建受控端 kuuki-agent.exe (仅 Windows)
#
# 为什么只打这一个: 受控端 = "被操作的那台机器", 是要分发到别人电脑上、那边往往没装
# Python 的那个。控制端 (-m remote.ctl / -m remote.client) 一直在开发环境里跑, 保持源码运行,
# 不打进这个包 —— 见 remote/__init__.py 里两端的部署位置说明。
#
# 为什么只在 windows-latest 上打: 受控端本来就只支持 Windows (屏幕走 PIL.ImageGrab、
# 输入走 pynput 的 Win32 后端), remote/__main__.py 有 platform_refusal() 门禁, 在别的平台上
# 打出来也是个一启动就退出的 exe。
#
# 产物:
#   - 每次推送: Actions artifacts (保留 14 天)
#   - 推 v* tag: 额外创建 GitHub Release, 挂 kuuki-agent-windows-x64.zip
#
# 本地复现:
#   pip install -r requirements.txt -r requirements-remote.txt "pyinstaller>=6"
#   pyinstaller packaging/kuuki-agent.spec --noconfirm
name: Build kuuki-agent

on:
  push:
    # master 上得先有 remote/ 和 packaging/ 才能挂 —— remote 扩展合进 master 之后
    # (2026-09-20) 才把它加回来。之前挂过一次, master 上没这些目录, 一 push 就红。
    branches: [master, feat/remote-control]
    tags: ["v*"]
  pull_request:
    branches: [master, feat/remote-control]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # 建 Release 需要 contents: write。
    # 注意: permissions **不支持** ${{ }} 表达式 —— 写了会让整个 workflow 文件解析失败
    # (表现为 run 0 秒 failure, "likely failed because of a workflow file issue")。
    # 只能给字面值。fork PR 场景下 GitHub 会自动把 token 降级成只读, 所以这里不会真的敞开。
    permissions:
      contents: write

    steps:
      # v4/v5 这一代 action 跑在 Node 20 上, GitHub 已标记弃用 (每次 run 都挂一条
      # annotation)。升到当前大版本消掉它 —— 免得将来强制下线时突然红。
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 准备 Python
        uses: actions/setup-python@v6
        with:
          # 3.11 是 av / aiortc / pywin32 wheel 覆盖最全的一档, 别轻易动
          python-version: "3.11"
          cache: pip
          # 三个都列上: 少列一个, 那个文件改了而别的没改时缓存键不变, 会用旧缓存
          cache-dependency-path: |
            requirements.txt
            requirements-remote.txt
            requirements-build.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-remote.txt -r requirements-build.txt -r requirements-dev.txt
          python -c "import PyInstaller; print('pyinstaller', PyInstaller.__version__)"

      - name: 依赖自检 (打包前先确认源码能跑)
        run: |
          python -c "import remote, remote.service, remote.screen, remote.input; print('remote ok', remote.VERSION)"
          python -c "import grpc, google.protobuf, websockets, PIL, pynput; print('transport ok')"
          python -c "import peerjs, aiortc, av, aioice; print('webrtc ok')"
          # main.py 才是 README 描述的**主流程** (手机传感器 -> 空气鼠标), remote/ 是后来
          # 加的扩展。它依赖 paho-mqtt 和 qrcode —— 全仓库只有它用这两个, 一旦从
          # requirements 里漏掉, 要等用户来报。import 一下就能挡住 (它有 __main__ 保护,
          # 导入没有副作用)。
          python -c "import main; print('main ok')"

      - name: 准备 Node (跑 web 界面的逻辑测试)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 单元测试 (打包前先确认逻辑没坏)
        # 放在打包之前: 逻辑错了就没必要花一分钟打一个注定是坏的 exe。
        # 依赖本机环境的用例自己会 skip (见 test_remote.py 里的 has_real_backend 等),
        # 所以 runner 上没有桌面/没有中文 locale 也不会假红。
        run: pytest test_remote.py -q

      - name: 姿态解算测试 (脚本式, pytest 收集不了)
        # test_attitude.py 顶层直接 raise SystemExit, pytest 一收集就把它判成失败,
        # 于是它一直只在本地跑过。姿态解算是空气鼠标的核心 (Mahony 积分 / 角度换算),
        # app.py 整条链路都压在上面 —— 不能因为文件不合 pytest 的口味就没人跑。
        run: python test_attitude.py

      - name: web 界面逻辑测试 (键盘 / token 握手)
        # web/ 是手机端的操作界面, 之前**零测试覆盖**: 键盘布局和 token 握手改坏了没人知道。
        # 用 node + 最小 DOM 桩跑真的 script.js —— 见 tests/web_ui.test.js。
        env:
          PY: python   # 键名要能在 controller.special_keys 里查到, 否则键摆上去也按不动
        run: node tests/web_ui.test.js

      - name: 文档代码块校验 (README/docs 里的命令得真能解析)
        # 文档里的 CLI 示例会随代码腐烂 —— 之前就是它抓出 shot 的位置参数被 path 吞掉。
        run: python check_ctl_docs.py

      - name: PyInstaller 打包
        # --workpath 显式指定: 后面的产物检查脚本按这个路径找 PYZ 的 TOC
        run: pyinstaller packaging/kuuki-agent.spec --noconfirm --distpath dist --workpath build/agent

      - name: 上传打包警告日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          # v5 默认不再覆盖同名 artifact: 重跑一次 workflow 会直接失败。
          # 这里的语义一直是"同一次 run 里覆盖", 显式写回来。
          overwrite: true
          name: kuuki-agent-build-warnings
          # PyInstaller 的 warn 文件在 workpath/<spec名>/ 下, 不是 workpath 根目录
          path: build/agent/kuuki-agent/warn-kuuki-agent.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: 冒烟 —— 启动 / 参数 / 版本
        shell: bash
        run: |
          set -euo pipefail
          EXE=dist/kuuki-agent/kuuki-agent.exe
          test -f "$EXE"
          "$EXE" --version
          "$EXE" --help > /dev/null
          echo "冒烟通过: exe 能启动, argparse 与 remote 包本体正常"

      - name: 冒烟 —— 惰性导入的依赖真的打进去了
        # peerjs / app / controller 都是函数体内 import 的, --help 走不到,
        # 不打进去的话用户一开 PeerJS 才炸。静态查 PYZ 清单, 不依赖屏幕和网络。
        run: python packaging/check_bundle.py build/agent/kuuki-agent

      - name: 冒烟 —— 自检 (需要桌面会话, 抓不到屏不算构建失败)
        # runner 以服务会话跑, ImageGrab 不一定有屏可抓; 但能跑通就是强证据,
        # 证明 PIL.ImageGrab / pynput 在打包后仍然可用。
        continue-on-error: true
        run: dist/kuuki-agent/kuuki-agent.exe --selftest

      - name: 端到端 —— 源码客户端真连一次打包后的 WS / gRPC
        # PeerJS 之外的两个传输, 打包后也得真连上才算数: 起 exe, 用源码 client 打过去。
        # 只走 127.0.0.1, 不依赖外网和桌面, 所以这条是**阻塞**的。
        # 端口**随机且避开默认**: 默认的 8765/50051 会撞 runner 上别的东西;
        # 写死一个固定端口也有坑 —— 连着 push 两个 commit 时 GitHub 会把两个 run
        # 同时起 (实测 #45/#46 是同一秒 run_started_at, concurrency 没拦住),
        # 后起的那个 exe 绑不上端口, 端到端就假红一次。
        shell: bash
        run: |
          # -e 必须有: 缺了它, 中间任何断言失败都会被吞掉, 只有最后一条命令说了算
          set -euo pipefail
          EXE=dist/kuuki-agent/kuuki-agent.exe
          WS_PORT=$(( 18000 + RANDOM % 8000 ))
          GRPC_PORT=$(( WS_PORT + 1 ))
          echo "端口: ws=$WS_PORT grpc=$GRPC_PORT"
          "$EXE" --ws --grpc --ws-port "$WS_PORT" --grpc-port "$GRPC_PORT" > agent_e2e.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if grep -q '已启动' agent_e2e.log 2>/dev/null; then break; fi
            sleep 1
          done
          cat agent_e2e.log
          # 没设 token 时的安全提示要随传输变: 关掉 PeerJS 才是"仅回环安全",
          # 开着 PeerJS 就得警告房间码经公开 broker 可配对。别让这句退化成一句套话
          grep -q '仅回环安全' agent_e2e.log

          python -m remote.client ws --url ws://127.0.0.1:$WS_PORT ping | tee ws_ping.json
          grep -q '"pong": true' ws_ping.json
          python -m remote.client ws --url ws://127.0.0.1:$WS_PORT screenshot ws_shot.png > /dev/null

          python -m remote.client grpc --target 127.0.0.1:$GRPC_PORT ping | tee grpc_ping.json
          grep -q '"pong": true' grpc_ping.json
          python -m remote.client grpc --target 127.0.0.1:$GRPC_PORT screenshot grpc_shot.png > /dev/null

          # 截图真落盘才算通: WS 那条走二进制帧, gRPC 那条走 protobuf 的 bytes 字段,
          # 两条路不一样, 都得验
          ls -l ws_shot.png grpc_shot.png
          test -s ws_shot.png
          test -s grpc_shot.png

          # 多显示器那一路也要在打包后的 exe 上跑通: monitors 枚举 (ctypes) 与
          # "抓第 0 块屏" 都是新增代码路径, 源码侧有单元测试 (打桩), 这里验的是
          # 打进 exe 之后 EnumDisplayMonitors 还调得动。
          python -m remote.client ws --url ws://127.0.0.1:$WS_PORT \
            op screen.monitors --args '{}' | tee monitors.json
          grep -q '"count"' monitors.json
          python -m remote.client ws --url ws://127.0.0.1:$WS_PORT screenshot ws_monitor0.png --monitor 0
          ls -l ws_monitor0.png
          test -s ws_monitor0.png

          # 手机端 (web/) 走的是 kuuki 老协议透传, 不是 op 封装 —— 这条才是用户
          # 扫码后真正在用的路。它要 `from app import handle_message`, 而 app.py
          # 顶层就 `app = App()` (含 pynput 控制器), 打进 exe 后能不能起来没人验过。
          # 用一个未知 t 的探针: 不产生任何输入, 但能证明模块加载 + 路由都活着。
          python -m remote.client ws --url ws://127.0.0.1:$WS_PORT \
            op kuuki --args '{"message":{"t":"__probe__"}}' | tee kuuki_probe.json
          grep -q '"handled": false' kuuki_probe.json

          # 文字识别 (screen.ocr) 也要在**打包后的 exe** 上够得着: 它走系统内置 OCR
          # (PowerShell + WinRT), 是唯一一个"要起外部进程"的 op, 打漏模块的表现
          # 就是这里 ModuleNotFoundError。
          # 判据只到"这个 op 通了": runner 是无头服务会话, 屏上未必有字、也未必装了
          # 中文语言包, 所以认出多少字不作为标准 —— 有 count 就算通, 明确回
          # unsupported 也算通 (那说明平台门禁正常, 不是崩了)。
          set +e
          python -m remote.client ws --url ws://127.0.0.1:$WS_PORT ocr --json > ocr.json 2>&1
          set -e
          cat ocr.json
          grep -q '"count"\|unsupported' ocr.json
          echo "端到端通过: WS / gRPC / kuuki 老协议透传 / OCR 四条路都通"

      - name: 深度冒烟 —— 真起一次 PeerJS 服务 (需要外网, 失败不阻塞)
        # 只开 PeerJS 一个传输, 看它能不能注册到公开 broker 拿到房间码。
        # 这一步依赖 runner 能连 0.peerjs.com, 外网抖动会让它红, 所以 continue-on-error。
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          EXE=dist/kuuki-agent/kuuki-agent.exe
          # --peerjs 写不写都一样 (它就是默认), 但 CI 日志里写明白更好读
          "$EXE" --peerjs --json > peerjs_smoke.log 2>&1 &
          pid=$!
          for i in $(seq 1 45); do
            if grep -q 'kuuki-mouse-' peerjs_smoke.log 2>/dev/null; then break; fi
            sleep 1
          done
          kill $pid 2>/dev/null || true
          cat peerjs_smoke.log
          grep -q 'kuuki-mouse-' peerjs_smoke.log && echo "深度冒烟通过: PeerJS 已注册到 broker" || echo "深度冒烟未通过 (可能是外网)"

      - name: 打包 zip
        shell: pwsh
        run: |
          # 带一份说明进去: 拿到 zip 的人往往是"被操作的那台机器"的使用者, 那边通常
          # 没 Python 也不看仓库, 没有这几行就不知道 exe 该怎么起。
          # 说明写在上游文件里而不是内联 —— PowerShell 的 here-string 结束标记 "@ 必须
          # 顶格, 和 YAML 的缩进要求直接冲突, 内联是写不对的。
          Copy-Item packaging/agent-README.txt README.txt
          Compress-Archive -Path dist/kuuki-agent, README.txt -DestinationPath kuuki-agent-windows-x64.zip
          Get-Item kuuki-agent-windows-x64.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传产物
        uses: actions/upload-artifact@v5
        with:
          overwrite: true
          name: kuuki-agent-windows-x64
          path: kuuki-agent-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: 发布 Release (仅 tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # 幂等: 重跑一次 workflow (或补跑失败的 run) 时 Release 已经存在了,
          # 直接 create 会 "already_exists" 失败, 那只是重跑, 不是构建坏了
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在, 改为覆盖上传产物"
            gh release upload "${GITHUB_REF_NAME}" kuuki-agent-windows-x64.zip \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              kuuki-agent-windows-x64.zip
          fi
