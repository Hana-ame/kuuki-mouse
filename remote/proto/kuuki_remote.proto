// kuuki-mouse 远程控制扩展 —— gRPC 接口定义
//
// 与 WebSocket 侧共用同一套语义 (见 remote/service.py), 这里只是把它变成
// 强类型 + 支持服务端流式截屏。
//
// 生成 (仓库根目录):
//   bash remote/proto/gen_proto.sh
// 或:
//   python -m grpc_tools.protoc -I remote/proto \
//       --python_out=remote/proto --grpc_python_out=remote/proto \
//       remote/proto/kuuki_remote.proto
//
// 注意: 仓库 .gitignore 里有 `*pb2.py` / `*pb2_grpc.py`, 但 remote/proto/ 下的
// 存根是运行必需, 已用取反规则 `!remote/proto/*.py` 允许入库。

syntax = "proto3";

package kuuki.remote.v1;

// ---------------------------------------------------------------- 基础类型

message Empty {}

message Ack {
  bool ok = 1;
  string message = 2;
}

message Point {
  int32 x = 1;
  int32 y = 2;
}

message Rect {
  int32 left = 1;
  int32 top = 2;
  int32 width = 3;
  int32 height = 4;
}

message Info {
  string version = 1;
  string os = 2;
  string platform = 3;
  string python = 4;
  string hostname = 5;
  string user = 6;
  string cwd = 7;
  string display = 8;
  string clipboard_tool = 11;
  bool token_required = 12;
  double uptime_s = 13;
  Point cursor = 14;
  repeated string capabilities = 15;
}

// ---------------------------------------------------------------- 截屏

message ScreenshotRequest {
  Rect region = 1;        // 不给则整屏 / 指定 monitor
  string format = 3;      // png / jpeg / webp (默认 png)
  int32 quality = 4;      // jpeg/webp 质量, 默认 80
  int32 max_width = 5;    // 等比缩到不超过该宽 (0 = 不限)
  int32 max_height = 6;   // 等比缩到不超过该高 (0 = 不限)
  double scale = 7;       // 显式缩放系数 (0 = 不限)
  bool draw_cursor = 8;   // 把光标画成十字 (截图本身通常不含光标)
}

message Image {
  bytes data = 1;
  string format = 2;
  int32 width = 3;
  int32 height = 4;
  int32 source_width = 5;
  int32 source_height = 6;
  Rect region = 9;
  double scale = 10;
  double captured_at = 11;
  double duration_ms = 12;
  Point cursor = 13;
  bool has_cursor = 14;
  bool cursor_in_frame = 15;
}

message StreamScreenshotsRequest {
  ScreenshotRequest shot = 1;
  double fps = 2;          // <=0 时用 interval_ms
  int32 interval_ms = 3;   // 默认 500ms
  int32 count = 4;         // 0 = 一直推到客户端取消
}

// ---------------------------------------------------------------- 鼠标

message MoveMouseRequest {
  int32 x = 1;
  int32 y = 2;
  double duration = 3;     // >0 时平滑移动 (秒)
}

message MoveMouseRelativeRequest {
  int32 dx = 1;
  int32 dy = 2;
  double duration = 3;
}

message ClickMouseRequest {
  string button = 1;       // left / middle / right
  int32 clicks = 2;        // 默认 1
  double interval = 3;     // 连击间隔 (秒)
  // 可选: 先把光标移到这里再点。与 ScrollRequest 的 at_x / at_y 一个道理 ——
  // 用 optional 是为了能只给其中一个 (另一个保持当前坐标), 也为了区分
  // 「没给」与「显式给 0」(原点是个合法坐标)。
  optional int32 at_x = 4;
  optional int32 at_y = 5;
}

message MouseButtonRequest {
  string button = 1;
}

message ScrollRequest {
  int32 dx = 1;            // 水平, >0 向右
  int32 dy = 2;            // 垂直, >0 向上
  int32 steps = 3;         // >1 时拆成多步平滑滚动 (总增量仍等于 dx/dy)
  // 每步间隔秒数。用 optional 才能区分「没给」与「显式给 0」: 前者用服务的默认
  // 0.05, 后者表示不分步间隔一路发完。proto3 的普通标量把两者都变成 0。
  optional double interval = 4;
  // 可选: 先把光标移到这里再滚。同样用 optional, 为了能只给其中一个
  // (另一个保持当前坐标) —— 与 WebSocket 侧 x/y 可单独缺省保持一致。
  optional int32 at_x = 5;
  optional int32 at_y = 6;
}

message DragRequest {
  int32 x1 = 1;
  int32 y1 = 2;
  int32 x2 = 3;
  int32 y2 = 4;
  string button = 5;
  // **每段**时长 (秒)。optional 同上: 缺省 0.3, 显式 0 表示直接跳到终点。
  optional double duration = 6;
  repeated Point points = 7;  // 路径点 (>=2); 给了就忽略 x1..y2
}

// ---------------------------------------------------------------- 键盘

message TypeTextRequest {
  string text = 1;
  double interval = 2;     // >0 时逐字符间隔
}

message KeyRequest {
  string key = 1;          // "enter" / "f5" / "a"
  string action = 2;       // tap / press / release
  repeated string modifiers = 3;
}

message HotkeyRequest {
  repeated string keys = 1;   // ["ctrl", "shift", "s"]
}

message ComboRequest {
  repeated string keys = 1;   // ["ctrl", "shift", "s"]
  double hold_ms = 2;         // >0 时全部按下后保持这么久再逆序松开
}

message KeyHoldRequest {
  string key = 1;             // 单个键, 例如 "f2"
  double ms = 2;              // 按住毫秒数, 必须 > 0
}

message PasteTextRequest {
  string text = 1;         // 写剪贴板 + Ctrl/Cmd+V (中文输入的可靠方式)
}

message KeyCheckRequest {
  repeated string keys = 1;   // 待检查的键名
}

message KeyCheckResult {
  string key = 1;
  bool supported = 2;
  string reason = 3;       // supported=false 时说明原因
}

message KeyCheckReply {
  repeated KeyCheckResult keys = 1;
}

// ---------------------------------------------------------------- 窗口
//
// 视觉定位 (locate) 只能说"屏幕上有个像输入框的东西", 说不出它属于哪个应用。
// 这一组 RPC 让调用方先用标题/进程名认窗口、把它切到前台, 再在窗口内部定位。
// 目前只有 Windows 受控端实现 (remote/window.py, 纯 ctypes)。

message WindowInfo {
  // 字段名与类型都跟着 service 的 dict 走:
  // - 叫 ``hwnd`` 而不是 ``handle`` —— 控制端会把 protobuf 转成 dict 与 WS 的
  //   结果互相比较, 键名不一致就等于结果不一致;
  // - 用 uint32 而不是 uint64 —— protobuf 的 JSON 映射把 64 位整数转成**字符串**,
  //   那样 gRPC 侧拿到 "1234"、WS 侧拿到 1234, 两边对不上。HWND 实际取值远小于
  //   2^32, 32 位装得下。
  uint32 hwnd = 1;         // HWND; window.focus 可以直接用它 (最可靠)
  string title = 2;
  string process = 3;      // 进程名, 不含路径与 .exe (例如 msedge)
  uint32 pid = 4;
  Rect rect = 5;
  bool visible = 6;
  bool minimized = 7;
  bool foreground = 8;     // 是不是当前前台窗口
}

message ListWindowsRequest {
  string title = 1;        // 标题子串 (不区分大小写)
  string process = 2;      // 进程名或 pid 子串, 例如 "msedge"
  int32 limit = 3;         // 0 = 不限
  bool include_hidden = 4; // 把隐藏的 / 被 DWM 隐藏的也算进来 (调试用)
}

message ListWindowsReply {
  repeated WindowInfo windows = 1;
  int32 count = 2;
}

message FocusWindowRequest {
  uint32 hwnd = 1;         // 直接给 HWND; 给了它就不再按标题找
  string title = 2;
  string process = 3;
  int32 index = 4;         // 命中多个时取第几个 (按 Z 序)
  optional double wait = 5;  // 切换后最多等多久确认前台 (秒; 缺省 0.5, 显式 0 = 不等)
}

message FocusWindowReply {
  bool focused = 1;        // 确认之后前台是不是它 —— 不是"调用成功了"
  uint32 hwnd = 2;
  string title = 3;
  string process = 4;
  uint32 pid = 5;
  Rect rect = 6;
  string method = 7;       // already / set-foreground / attach-thread / alt-key / ""
  int32 matched = 8;       // 命中了几个 (按标题/进程名找时)
}

// ---------------------------------------------------------------- 被控端提示

message NotifyRequest {
  string message = 1;
  string detail = 2;
  double seconds = 3;      // 0 = 用服务端默认 6 秒
  string corner = 4;       // br / tr / tl / bl
}

// ---------------------------------------------------------------- kuuki 老协议

message KuukiMessageRequest {
  string json = 1;         // 一条老协议 JSON, 例如 {"t":"mouse","button":"left"}
}

message KuukiMessageReply {
  bool handled = 1;
  string json = 2;
}

// ---------------------------------------------------------------- 服务

service RemoteControl {
  // 元信息
  rpc GetInfo(Empty) returns (Info);
  rpc Ping(Empty) returns (Ack);

  // 截屏
  rpc Screenshot(ScreenshotRequest) returns (Image);
  rpc StreamScreenshots(StreamScreenshotsRequest) returns (stream Image);

  // 鼠标
  rpc GetMousePosition(Empty) returns (Point);
  rpc MoveMouse(MoveMouseRequest) returns (Ack);
  rpc MoveMouseRelative(MoveMouseRelativeRequest) returns (Ack);
  rpc ClickMouse(ClickMouseRequest) returns (Ack);
  rpc MouseDown(MouseButtonRequest) returns (Ack);
  rpc MouseUp(MouseButtonRequest) returns (Ack);
  rpc Scroll(ScrollRequest) returns (Ack);
  rpc ScrollHorizontal(ScrollRequest) returns (Ack);
  rpc Drag(DragRequest) returns (Ack);

  // 键盘
  rpc TypeText(TypeTextRequest) returns (Ack);
  rpc PressKey(KeyRequest) returns (Ack);
  rpc Hotkey(HotkeyRequest) returns (Ack);
  rpc Combo(ComboRequest) returns (Ack);
  rpc HoldKey(KeyHoldRequest) returns (Ack);
  rpc PasteText(PasteTextRequest) returns (Ack);
  // 预检: 这些键在当前键盘布局里能不能发 (不实际按键)
  rpc CheckKeys(KeyCheckRequest) returns (KeyCheckReply);

  // 窗口: 让"视觉定位"有个确定的作用域 (目前仅 Windows 受控端)
  rpc ListWindows(ListWindowsRequest) returns (ListWindowsReply);
  rpc GetForegroundWindow(Empty) returns (WindowInfo);
  rpc FocusWindow(FocusWindowRequest) returns (FocusWindowReply);

  // 被控端无焦点角标 (只通知, 不抢前台)
  rpc Notify(NotifyRequest) returns (Ack);

  // 空气鼠标老协议透传 (姿态数据 / 鼠标键 / 文本)
  rpc SendKuukiMessage(KuukiMessageRequest) returns (KuukiMessageReply);
}
