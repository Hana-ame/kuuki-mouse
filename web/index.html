<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>kuuki-mouse 手机遥控</title>
    <link rel="stylesheet" href="style.css">
    <script nomodule>document.documentElement.classList.add('no-module');</script>
</head>
<body>
    <div id="app">
        <header>
            <h1>kuuki-mouse</h1>
            <p id="status">未配对</p>
        </header>

        <section id="pair" class="card">
            <label for="roomInput">房间码</label>
            <input id="roomInput" placeholder="ABCDE" autocomplete="off" autocapitalize="characters" maxlength="8">
            <label for="tokenInput">Token (主机设了 <code>--token</code> 才要填)</label>
            <input id="tokenInput" type="password" placeholder="留空 = 主机没设 token" autocomplete="off">
            <button id="pairBtn">开始配对</button>
        </section>

        <section id="control" class="card hidden">
            <div class="row">
                <button id="calibrateBtn">校准姿态</button>
                <button id="modeBtn">✍ 输入</button>
            </div>
            <div class="row3">
                <button id="clickBtn" class="big">左键</button>
                <button id="midBtn">中键</button>
                <button id="rightBtn">右键</button>
            </div>
            <div class="row2">
                <button id="wheelUpBtn">滚轮 ↑</button>
                <button id="wheelDownBtn">滚轮 ↓</button>
            </div>

            <div id="inputArea" class="hidden">
                <textarea id="textInput" rows="2" placeholder="在这里打字(可用手机拼音输入法), 每个字符立即发送到电脑; 空框按退格=PC退格"></textarea>
                <div id="keyboard"></div>
            </div>
        </section>

        <section id="sensors" class="card hidden">
            <div>加速度(含重力): <span id="accel">-</span></div>
            <div>姿态(αβγ): <span id="orient">-</span></div>
            <div>角速度(rad/s): <span id="rot">-</span></div>
            <div>通道: <span id="chan">-</span></div>
        </section>
    </div>

    <!-- 两个库都自托管在 vendor/, 不再从 unpkg 拉。
         unpkg 在国内经常连不上/极慢, 而 <script src> 是阻塞渲染的 —— 卡在 CDN 上
         的表现就是页面白屏等超时。peerjs 更是缺了就整个页面废 (mqtt 那个脚本自己
         有 typeof 容错, 只是没有兜底通道)。 -->
    <script src="vendor/peerjs.min.js"></script>
    <script>
        // vendor 没加载出来 (部署漏文件 / 仓库没带上) 就退回 CDN, 有网总比白屏强
        if (typeof Peer === 'undefined') {
            document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');
        }
    </script>
    <!-- mqtt 只是兜底通道, 用 defer 不挡着首屏; 加载失败 script.js 会自己跳过 -->
    <script src="vendor/mqtt.min.js" defer></script>
    <!-- 也得 defer: defer 脚本按文档顺序执行, 而普通 script 会立刻跑 ——
         只给 mqtt 加 defer 的话 script.js 反而先执行, 那时 mqtt 还没定义,
         connectMqtt() 直接跳过, 兜底通道就没了。 -->
    <script src="script.js" defer></script>
</body>
</html>
